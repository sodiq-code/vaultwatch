# VaultWatch ruff configuration
# Line length is generous because AI prompt strings are embedded in Python code

line-length = 160
target-version = "py312"

# Markdown files contain illustrative Python snippets that are meant for
# reader readability (aligned comments, single-quoted strings for examples).
# ruff format would reformat them, breaking the readability of code examples
# in documentation and causing CI "Lint & Format" checks to always fail.
extend-exclude = ["*.md"]

[lint]
select = ["E", "F", "W"]
ignore = []

[lint.per-file-ignores]
"scripts/*" = ["E701", "E702", "E722"]
"tests/*" = ["F841", "E402"]
