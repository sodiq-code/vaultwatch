name: VaultWatch CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  PYTHON_VERSION: "3.11"
  CASPER_MOCK: "true"

jobs:
  # Lint & Format
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install lint tools
        run: pip install ruff

      - name: Ruff lint
        run: ruff check . --output-format=github

      - name: Ruff format check
        run: ruff format --check .

  # Python Tests
  test-python:
    name: Python Tests
    runs-on: ubuntu-latest
    needs: lint
    env:
      GROQ_API_KEY: mock-key-for-ci
      OPENROUTER_API_KEY: mock-key-for-ci
      CASPER_MOCK: "true"
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e sdk/

      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short

      - name: Run integration tests
        run: pytest tests/integration/ -v --tb=short

      - name: Run demo scenario tests
        run: pytest tests/demo/ -v -s --tb=short

  # SDK Validation
  validate-sdk:
    name: Validate Python SDK
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install and validate SDK
        run: |
          pip install httpx pydantic
          pip install -e sdk/
          python -c "from vaultwatch import VaultWatchClient; print('SDK import OK')"

  # Rust Contract Tests (smoke test only — full WASM build in build-contracts.yml)
  test-contracts:
    name: Rust Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-01-01
          targets: wasm32-unknown-unknown
          components: rust-src

      - name: Cache Cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run contract tests
        working-directory: contracts
        run: cargo +nightly-2026-01-01 test --lib --target x86_64-unknown-linux-gnu
        continue-on-error: true

  # Docker Build (main branch only)
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test-python]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: vaultwatch:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
